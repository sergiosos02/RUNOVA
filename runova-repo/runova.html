<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUNOVA</title>
<style>
:root{--bg:#F3F3F0;--card:#fff;--ink:#14151A;--mut:#6B6E7B;--line:#E4E4DE;--ac:#3A3CFF;--acink:#fff;--ok:#12A36B;--bad:#D9382B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t="dark"]{--bg:#0D0E13;--card:#171820;--ink:#F2F2F5;--mut:#9093A3;--line:#262833;--ac:#8087FF;--acink:#0D0E13}
@media(prefers-color-scheme:dark){:root:not([data-t="light"]):not([data-t="dark"]){--bg:#0D0E13;--card:#171820;--ink:#F2F2F5;--mut:#9093A3;--line:#262833;--ac:#8087FF;--acink:#0D0E13}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:6px 10px;min-width:56px;min-height:48px;border-radius:14px}
nav button.on{color:var(--ac);font-weight:700}nav button span{font-size:22px;line-height:1}
nav .plus{background:var(--ac);color:var(--acink);border-radius:50%;width:52px;height:52px;min-width:0;justify-content:center;margin-top:-18px;font-size:28px;font-weight:300}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 14px}h2{font-size:18px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--acink);display:grid;place-items:center;font-weight:800;flex:none}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stats small{display:block;color:var(--mut);font-size:13px}
.btn{background:var(--ac);color:var(--acink);border-radius:14px;padding:12px 18px;font-weight:700;min-height:46px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:7px 14px;min-height:36px;font-size:14px}
.btn.b{width:100%}
.chip{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;margin:0 6px 6px 0;background:var(--card)}.chip.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:4px 0 12px;min-height:46px}
label{font-size:14px;color:var(--mut);font-weight:600}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.act{display:flex;gap:18px;margin-top:10px}.act button{color:var(--mut);font-size:15px;min-height:36px}.act .on{color:var(--bad);font-weight:700}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--bg);border:1px solid var(--line)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}.chart div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.chart i{display:block;background:var(--ac);border-radius:8px 8px 3px 3px;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-weight:600}
.emp{text-align:center;padding:30px 10px;color:var(--mut)}
.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.4)}}
.cover{height:96px;border-radius:20px 20px 0 0;margin:-16px -16px 0;background:linear-gradient(135deg,var(--ac),#22C7B5)}
.card.hasmedia{padding:0;overflow:hidden}.card.hasmedia .pad{padding:16px}
.media{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:var(--line)}
.sband{height:64px;border-radius:16px;display:grid;place-items:center;font-size:30px;margin-bottom:2px}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:4px auto;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--line) 0)}
.ring b{background:var(--card);width:102px;height:102px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.15;font-size:15px}
.ring b small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.macros{display:flex;gap:10px;justify-content:center;margin-top:10px}.macros div{text-align:center;font-size:13px;color:var(--mut)}.macros b{display:block;color:var(--ink);font-size:16px}
.cam{width:100%;border-radius:16px;background:#000;max-height:50vh;object-fit:cover}
.shot{position:relative;border-radius:16px;overflow:hidden}
.scanning{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(58,60,255,.35));display:flex;align-items:flex-end;justify-content:center;padding:12px;font-weight:700;color:#fff}
.scanbar{position:absolute;left:0;right:0;height:3px;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:scan 1.4s linear infinite}
@keyframes scan{0%{top:4%}100%{top:94%}}
.thumb{display:flex;gap:8px;margin:4px 0 12px}.thumb img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.addph{width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;font-size:22px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:200px;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 12px;border-top:0;border-right:1px solid var(--line)}
nav button{flex-direction:row;gap:12px;font-size:16px;width:100%;justify-content:flex-start}nav .plus{border-radius:14px;width:100%;height:48px;margin:0 0 12px;order:-1;font-size:16px;font-weight:700}
main{margin-left:230px;max-width:680px;padding-bottom:40px}.toast{bottom:30px}.modal{align-items:center}.sheet{border-radius:24px}}
</style></head><body>
<div id="app"><nav id="nav" aria-label="Navegación principal"></nav><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SP={run:['🏃','Running'],bike:['🚴','Ciclismo'],gym:['🏋️','Gimnasio'],walk:['🚶','Caminar'],swim:['🏊','Natación'],hike:['🥾','Senderismo'],ball:['🏀','Baloncesto'],other:['⛹️','Otros']};
const SC={run:'#3A3CFF,#22C7B5',bike:'#F2994A,#F2C94C',gym:'#D9382B,#9B2CFF',walk:'#12A36B,#A9E34B',swim:'#2F80ED,#56CCF2',hike:'#8D6E63,#C0A16B',ball:'#E8590C,#FFB020',other:'#6B6E7B,#9093A3'};
const FOODS=[['Ensalada con pollo',320,28,18,14],['Bol de arroz y verduras',480,14,86,9],['Pasta con tomate',520,16,92,12],['Tortilla de patatas',410,18,38,21],['Sándwich integral',390,22,44,13],['Salmón con verduras',460,38,12,27],['Yogur con fruta y avena',290,13,42,8],['Hamburguesa con patatas',820,34,78,42],['Pizza (2 porciones)',640,24,72,26],['Legumbres con verduras',430,22,58,10]];
const DAY=864e5,K='runova_v1',GOAL={kcal:2400,p:160,c:280,f:75};
const U=[['carlos','Carlos Ruiz'],['lucia','Lucía Vega'],['sergio','Sergio Mora'],['alvaro','Álvaro Gil'],['marta','Marta Soler'],['nuria','Nuria Paz']];
function seed(){const n=Date.now(),h=x=>n-x*36e5;return{
me:null,theme:'system',tab:'home',follows:['carlos','lucia'],blocked:[],hidden:[],saved:[],reports:[],
posts:[
{id:1,u:'carlos',t:'act',sp:'run',km:8.42,min:42.3,kcal:612,place:'Madrid Río',txt:'Buen entrenamiento hoy.',ts:h(2),likes:48,cm:[['lucia','¡Vaya ritmo!']]},
{id:2,u:'lucia',t:'meal',name:'Comida post-entreno',desc:'Pollo + arroz + verduras',kcal:680,p:52,c:75,f:15,ts:h(5),likes:31,cm:[]},
{id:3,u:'sergio',t:'act',sp:'bike',km:42.1,min:96,kcal:1180,place:'Casa de Campo',txt:'Ruta larga del domingo.',ts:h(9),likes:22,cm:[]},
{id:4,u:'marta',t:'txt',txt:'¿Alguien para correr el sábado por la mañana?',ts:h(14),likes:9,cm:[]},
{id:5,u:'alvaro',t:'act',sp:'gym',km:0,min:65,kcal:420,place:'Fuerza: pierna',txt:'Día de sentadillas.',ts:h(20),likes:14,cm:[]}],
liked:[],
acts:[[1,5.2,28,340],[3,10.1,52,650],[5,6.4,34,410],[8,8,41,520],[9,5,27,330],[11,12.3,64,790]].map((a,i)=>({id:100+i,sp:'run',km:a[1],min:a[2],kcal:a[3],ts:n-a[0]*DAY})),
meals:[{id:200,slot:'Desayuno',name:'Avena con plátano',kcal:420,p:18,c:70,f:9,ts:n},{id:201,slot:'Comida',name:'Arroz con pollo',kcal:720,p:52,c:78,f:18,ts:n}],
events:[
{id:1,name:'Running Madrid Río',sp:'run',date:'2026-10-03',time:'10:00',place:'Madrid Río, Puente del Rey',km:7,lvl:'Intermedio',max:15,by:'carlos',going:['carlos','lucia','sergio','marta','nuria','alvaro','x1','x2'],d:2},
{id:2,name:'Ruta en bici Casa de Campo',sp:'bike',date:'2026-10-04',time:'09:00',place:'Lago, Casa de Campo',km:35,lvl:'Avanzado',max:12,by:'sergio',going:['sergio','alvaro'],d:6},
{id:3,name:'Baloncesto 3x3 en Retiro',sp:'ball',date:'2026-10-06',time:'19:30',place:'Pistas del Retiro',km:0,lvl:'Todos',max:9,by:'marta',going:['marta','nuria','lucia'],d:4},
{id:4,name:'Senderismo La Pedriza',sp:'hike',date:'2026-10-10',time:'08:30',place:'Aparcamiento Canto Cochino',km:12,lvl:'Intermedio',max:20,by:'nuria',going:['nuria'],d:22}]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function theme(){const t=S.theme;if(t==='system')document.documentElement.removeAttribute('data-t');else document.documentElement.dataset.t=t}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;t.setAttribute('role','status');document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const name=u=>u===S.me?.user?S.me.name:(U.find(x=>x[0]===u)||[u,u])[1];
const ini=u=>name(u).split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const pace=(km,min)=>km?(()=>{const p=min/km;return Math.floor(p)+':'+String(Math.round((p%1)*60)).padStart(2,'0')})():'–';
const ago=ts=>{const h=Math.round((Date.now()-ts)/36e5);return h<1?'ahora':h<24?'hace '+h+' h':'hace '+Math.round(h/24)+' d'};
const fmt=m=>Math.floor(m/60)?Math.floor(m/60)+'h '+Math.round(m%60)+'m':Math.round(m)+' min';
function go(t){S.tab=t;save();render();window.scrollTo(0,0)}
function render(){theme();if(!S.me)return onboard();
if(S.tab==='gps'){$('#nav').innerHTML='';$('#main').innerHTML=vTrack();return}
const T=[['home','🏠','Inicio'],['act','🏃','Actividad'],['plus','+','Crear'],['exp','🧭','Explorar'],['me','👤','Perfil']];
$('#nav').innerHTML=T.map(([k,i,l])=>k==='plus'?`<button class="plus" onclick="create()" aria-label="Crear"><span style="font-size:inherit">+</span></button>`:`<button class="${S.tab===k?'on':''}" onclick="go('${k}')" ${S.tab===k?'aria-current="page"':''}><span>${i}</span>${l}</button>`).join('');
const V={home:vHome,act:vAct,exp:vExp,me:vMe,nut:vNut}[S.tab]||vHome;$('#main').innerHTML=V()}
/* ONBOARDING */
let ob=0;const OB=['Tu deporte. Tu comunidad.','Registra tus entrenamientos.','Controla tu nutrición.','Encuentra personas y entrenamientos cerca de ti.','Supera tus propios límites.'];
function onboard(){$('#nav').innerHTML='';
if(ob<5){$('#main').innerHTML=`<div class="card" style="margin-top:12vh;padding:32px 24px"><div class="big" style="font-size:40px">${OB[ob]}</div><p class="mut">Paso ${ob+1} de 5</p><div class="row" style="margin-top:24px"><button class="btn" onclick="ob++;render()">${ob<4?'Siguiente':'Empezar'}</button>${ob<4?'<button class="btn g" onclick="ob=5;render()">Saltar</button>':''}</div></div>`;return}
$('#main').innerHTML=`<h1>Crea tu perfil</h1><div class="card"><label>Nombre</label><input id="o1" autocomplete="name"><label>Usuario</label><input id="o2" placeholder="sin @"><label>Deporte favorito</label><select id="o3">${Object.entries(SP).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`)}</select><label>Objetivo</label><select id="o4"><option>Mantenerme activo</option><option>Mejorar rendimiento</option><option>Perder grasa</option><option>Ganar músculo</option><option>Preparar una carrera</option></select><label>Privacidad del perfil</label><select id="o5"><option value="public">Público</option><option value="private">Privado</option></select><p class="mut">Los cálculos de nutrición son estimaciones, no consejo médico.</p><button class="btn b" onclick="finish()">Entrar en RUNOVA</button></div>`}
function finish(){const n=$('#o1').value.trim(),u=$('#o2').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(!n||u.length<3)return toast('Escribe tu nombre y un usuario de 3+ letras');
S.me={name:n,user:u,sp:$('#o3').value,goal:$('#o4').value,priv:$('#o5').value,bio:''};S.tab='home';save();render();toast('Bienvenido, '+n.split(' ')[0])}
/* HOME */
function media(p){if(p.photo)return`<img src="${p.photo}" class="media">`;if(p.t==='act')return`<div class="media" style="background:linear-gradient(135deg,${SC[p.sp].split(',')[0]},${SC[p.sp].split(',')[1]});display:grid;place-items:center;font-size:44px">${SP[p.sp][0]}</div>`;return''}
function post(p){const on=S.liked.includes(p.id),body=p.t==='act'?`<div class="row" style="margin:10px 0 2px"><span class="badge">${SP[p.sp][0]} ${SP[p.sp][1]}</span></div><div class="stats">${p.km?`<div><div class="big">${p.km.toFixed(2).replace('.',',')}</div><small>km</small></div>`:''}<div><div class="big">${fmt(p.min)}</div><small>tiempo</small></div>${p.km?`<div><div class="big">${pace(p.km,p.min)}</div><small>min/km</small></div>`:`<div><div class="big">${p.kcal}</div><small>kcal</small></div>`}</div><div class="mut">🔥 ${p.kcal} kcal${p.place?' · 📍 '+E(p.place):''}</div>`
:p.t==='meal'?`<div style="margin:10px 0"><b>🍽 ${E(p.name)}</b><div class="mut">${E(p.desc||'')}</div></div><div class="stats"><div><div class="big">${p.kcal}</div><small>kcal</small></div><div><div class="big">${p.p} g</div><small>proteína</small></div><div><div class="big">${p.c} g</div><small>carbos · ${p.f} g grasa</small></div></div>`:'';
return`<article class="card hasmedia">${media(p)}<div class="pad"><div class="row"><div class="av">${ini(p.u)}</div><div style="flex:1"><b>${E(name(p.u))}</b><div class="mut">@${E(p.u)} · ${ago(p.ts)}</div></div>${p.u!==S.me.user?`<button class="btn g s" onclick="menu(${p.id})" aria-label="Más opciones">⋯</button>`:''}</div>${body}${p.txt?`<p style="margin:10px 0 0">${E(p.txt)}</p>`:''}<div class="act"><button class="${on?'on':''}" onclick="like(${p.id})" aria-pressed="${on}">${on?'❤️':'🤍'} ${p.likes+(on?1:0)}</button><button onclick="comments(${p.id})">💬 ${p.cm.length}</button><button onclick="share(${p.id})">↗ Compartir</button><button onclick="sv(${p.id})">${S.saved.includes(p.id)?'🔖':'📑'}</button></div></div></article>`}
function vHome(){const ps=S.posts.filter(p=>!S.blocked.includes(p.u)&&!S.hidden.includes(p.id)&&(p.u===S.me.user||S.follows.includes(p.u)||!S.follows.length||true)).sort((a,b)=>b.ts-a.ts);
return`<h1>Hola, ${E(S.me.name.split(' ')[0])}</h1><div class="card row sp"><div><div class="mut">Hoy</div><b>${S.meals.filter(m=>new Date(m.ts).toDateString()===new Date().toDateString()).reduce((a,m)=>a+m.kcal,0)} / ${GOAL.kcal} kcal</b></div><button class="btn s" onclick="go('nut')">Nutrición</button></div>${ps.length?ps.map(post).join(''):'<div class="emp">Tu feed está vacío. Sigue a alguien en Explorar o publica algo.</div>'}`}
function like(id){const i=S.liked.indexOf(id);i<0?S.liked.push(id):S.liked.splice(i,1);save();render()}
function sv(id){const i=S.saved.indexOf(id);i<0?S.saved.push(id):S.saved.splice(i,1);save();render();toast(i<0?'Guardado':'Quitado de guardados')}
function share(id){const p=S.posts.find(x=>x.id===id),t=`RUNOVA · ${name(p.u)}: ${p.km?p.km+' km en '+fmt(p.min):p.name||p.txt}`;navigator.share?navigator.share({text:t}).catch(()=>{}):(navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{}),toast('Texto copiado'))}
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='modal';m.onclick=e=>{if(e.target===m)closeM()};m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;document.body.appendChild(m)}
function closeM(){const m=$('#modal');if(m)m.remove()}
function pickPhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),mw=480,s=Math.min(1,mw/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(f)};inp.click()}
function scanFood(){modal(`<h2 style="margin-top:0">📷 Escáner de alimentos</h2><p class="mut">Haz una foto de tu plato y la IA estimará los alimentos y las calorías. Podrás revisar y editar el resultado.</p><div id="scanZone"><button class="btn b" onclick="pickPhoto(gotShot)">Hacer o subir foto</button></div>`)}
function gotShot(data){$('#scanZone').innerHTML=`<div class="shot"><img src="${data}" class="media" style="aspect-ratio:4/3"><div class="scanbar"></div><div class="scanning">Analizando alimentos…</div></div>`;
setTimeout(()=>{const f=FOODS[Math.floor(Math.random()*FOODS.length)];
$('#scanZone').innerHTML=`<img src="${data}" class="media" style="aspect-ratio:4/3;border-radius:16px;margin-bottom:10px"><p class="mut" style="margin:0 0 2px">La IA detectó:</p><label>Alimento</label><input id="sf0" value="${f[0]}"><div class="row"><div><label>Kcal</label><input id="sf1" inputmode="numeric" value="${f[1]}"></div><div><label>Proteína g</label><input id="sf2" inputmode="numeric" value="${f[2]}"></div></div><div class="row"><div><label>Carbos g</label><input id="sf3" inputmode="numeric" value="${f[3]}"></div><div><label>Grasa g</label><input id="sf4" inputmode="numeric" value="${f[4]}"></div></div><p class="mut">Estimación automática. Revisa y ajusta antes de guardar.</p><button class="btn b" onclick="useShot('${data}')">Usar estos valores</button>`},1100)}
function useShot(data){fMeal({name:$('#sf0').value,kcal:Math.round(num('#sf1')),p:Math.round(num('#sf2')),c:Math.round(num('#sf3')),f:Math.round(num('#sf4')),photo:data})}
function comments(id){const p=S.posts.find(x=>x.id===id);modal(`<h2 style="margin-top:0">Comentarios</h2>${p.cm.length?p.cm.map(c=>`<p><b>${E(name(c[0]))}</b> ${E(c[1])}</p>`).join(''):'<p class="mut">Sé el primero en comentar.</p>'}<input id="cm" maxlength="200" placeholder="Escribe un comentario"><button class="btn b" onclick="addC(${id})">Comentar</button>`)}
function addC(id){const v=$('#cm').value.trim();if(!v)return;S.posts.find(x=>x.id===id).cm.push([S.me.user,v]);save();closeM();render();toast('Comentado')}

let trk=null,trkT=null;
function gpsPick(){modal(`<h2 style="margin-top:0">Entrenar con GPS</h2><p class="mut">Usaremos tu ubicación solo mientras dure el entrenamiento, para medir distancia y ritmo.</p><label>Deporte</label><select id="g1">${['run','walk','bike','hike'].map(k=>`<option value="${k}">${SP[k][0]} ${SP[k][1]}</option>`).join('')}</select><button class="btn b" onclick="startTrack($('#g1').value)">Empezar</button>`)}
function hav(a,b){const R=6371000,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function startTrack(sp){if(!navigator.geolocation)return toast('Tu navegador no soporta GPS');
trk={sp,pts:[],km:0,start:Date.now(),pausedMs:0,pauseAt:0,status:'run',wid:null};closeM();S.tab='gps';render();
trk.wid=navigator.geolocation.watchPosition(onPos,()=>toast('No se pudo acceder a tu ubicación. Revisa los permisos.'),{enableHighAccuracy:true});
trkT=setInterval(tick,1000)}
function onPos(pos){if(!trk||trk.status!=='run')return;const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
if(trk.pts.length)trk.km+=hav(trk.pts[trk.pts.length-1],p)/1000;trk.pts.push(p);drawTrack()}
function elapsed(){return(Date.now()-trk.start-trk.pausedMs)/1000}
function tick(){if(!trk)return;const s=Math.max(0,elapsed()),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s/60)%60).padStart(2,'0'),sec=String(Math.floor(s%60)).padStart(2,'0');
const t=$('#gt'),k=$('#gk'),p=$('#gp');if(t)t.textContent=h+':'+m+':'+sec;if(k)k.textContent=trk.km.toFixed(2).replace('.',',');if(p)p.textContent=trk.km>0.05?pace(trk.km,s/60):'–'}
function drawTrack(){const el=$('#gsvg');if(!el||trk.pts.length<2)return;const lats=trk.pts.map(p=>p.lat),lngs=trk.pts.map(p=>p.lng),minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lngs),maxLo=Math.max(...lngs),w=300,h=300,pad=20,sx=maxLo>minLo?(w-2*pad)/(maxLo-minLo):0,sy=maxLa>minLa?(h-2*pad)/(maxLa-minLa):0,s=Math.min(sx,sy)||1;
const pts=trk.pts.map(p=>[(pad+(p.lng-minLo)*s).toFixed(1),(h-pad-(p.lat-minLa)*s).toFixed(1)]);
el.setAttribute('points',pts.map(p=>p.join(',')).join(' '));const last=pts[pts.length-1];const dot=$('#gdot');if(dot&&last){dot.setAttribute('cx',last[0]);dot.setAttribute('cy',last[1])}}
function pauseTrack(){if(!trk)return;if(trk.status==='run'){trk.status='paused';trk.pauseAt=Date.now();navigator.geolocation.clearWatch(trk.wid)}else{trk.pausedMs+=Date.now()-trk.pauseAt;trk.status='run';trk.wid=navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true})}render();drawTrack();tick()}
function askFinish(){modal(`<h2 style="margin-top:0">¿Finalizar entrenamiento?</h2><p class="mut">Se guardará ${trk.km.toFixed(2).replace('.',',')} km registrados hasta ahora.</p><div class="row"><button class="btn b" onclick="finishTrack()">Sí, finalizar</button><button class="btn g b" onclick="closeM()">Seguir entrenando</button></div>`)}
function finishTrack(){clearInterval(trkT);if(trk.wid!=null)navigator.geolocation.clearWatch(trk.wid);const min=elapsed()/60,sp=trk.sp,km=trk.km,rate={run:11,bike:8,walk:4,hike:6}[sp],kcal=Math.round(rate*min*.9);
const a={id:Date.now(),sp,km,min,kcal,route:trk.pts.length>1?trk.pts.filter((_,i)=>i%Math.max(1,Math.floor(trk.pts.length/80))===0):trk.pts,ts:Date.now()};S.acts.push(a);
S.posts.push({id:a.id,u:S.me.user,t:'act',sp,km,min,kcal,txt:'Entrenamiento con GPS.',ts:a.ts,likes:0,cm:[]});save();closeM();trk=null;S.tab='act';render();toast('🔥 Actividad completada · +'+km.toFixed(2)+' km · +'+kcal+' kcal')}
function vTrack(){if(!trk)return'';const paused=trk.status==='paused';
return`<div style="padding-top:env(safe-area-inset-top,0px)"><div class="shot" style="margin-bottom:14px"><svg id="gmap" viewBox="0 0 300 300" style="width:100%;aspect-ratio:1;background:linear-gradient(135deg,${SC[trk.sp].split(',')[0]}22,${SC[trk.sp].split(',')[1]}22);border-radius:20px"><polyline id="gsvg" points="" fill="none" stroke="${SC[trk.sp].split(',')[0]}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle id="gdot" r="7" fill="${SC[trk.sp].split(',')[0]}"/></svg>${trk.pts.length<2?'<div class="scanning" style="position:absolute;inset:0;align-items:center">Buscando señal GPS…</div>':''}</div><div class="card" style="text-align:center"><div class="big" id="gt" style="font-size:40px">00:00:00</div><div class="stats" style="margin-top:14px"><div><div class="big" id="gk">0,00</div><small>km</small></div><div><div class="big" id="gp">–</div><small>min/km</small></div><div><div class="big">${SP[trk.sp][0]}</div><small>${SP[trk.sp][1]}</small></div></div></div><div class="row" style="margin-top:14px"><button class="btn g b" onclick="pauseTrack()">${paused?'▶ Reanudar':'⏸ Pausar'}</button><button class="btn b" style="background:var(--bad)" onclick="askFinish()">⏹ Finalizar</button></div><p class="mut" style="text-align:center;margin-top:10px">Tu ubicación solo se usa durante el entrenamiento.</p></div>`}

const days=[...Array(7)].map((_,i)=>{const t=Date.now()-(6-i)*DAY,l=S.acts.filter(x=>new Date(x.ts).toDateString()===new Date(t).toDateString());return[['D','L','M','X','J','V','S'][new Date(t).getDay()],sum(l,'km')]}),mx=Math.max(1,...days.map(d=>d[1]));
